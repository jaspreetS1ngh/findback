services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: findback
      POSTGRES_USER: findback
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - findback_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U findback -d findback"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  findback_pgdata: